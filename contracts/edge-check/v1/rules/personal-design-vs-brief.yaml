edge: personal-design-vs-brief
subject_role: personal-design
basis_roles: [brief]
items:
  - id: R1
    text: >-
      Каждая функция брифа (FR-NN) получает в дизайне названный механизм
      (модуль, файл, команда, вызов) или явный отказ с причиной.
  - id: R2
    text: >-
      Решения дизайна учитывают все пять строк контекста брифа (пользователи,
      авторизация, сеть, локальная система, платформа).
  - id: R3
    text: >-
      Дизайн не противоречит брифу и не сужает его функции и критерии
      приёмки без объявления.
severity:
  blocking: [blocker, major]
  advisory: [minor]
applicability: []
