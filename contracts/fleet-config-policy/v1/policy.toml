# Политика флота для конфига spec-runner (`spec-runner.config.yaml`).
#
# SSOT — этот файл (решение владельца 2026-10-04). Конфиг spec-runner живёт
# в каждом репо: большая часть его — свойства репо (команды тестов, линтера),
# но часть ключей — политика флота, записанная копиями, и копии разъезжаются
# молча. Здесь перечислены ровно те ключи, значение которых флот требует
# одинаковым; сенсор `fleet_config_policy.py` (`make config-policy`) сверяет
# с ним каждый репо и называет отклонения. Чинит владелец репо — PR-ом или
# по заявке; сенсор ничего не пишет.
#
# Поля ключа:
#   name     — ключ конфига spec-runner (плоский v2 или под `executor:` v1);
#   required — требуемое значение;
#   default  — умолчание spec-runner, когда ключа нет (оно и действует);
#   reason   — зачем это политика флота, а не выбор репо;
#   effective_since — версия spec-runner, с которой ключ существует (ниже —
#              молча игнорируется);
#   protected_since — первая ВЫПУЩЕННАЯ версия, где защита по ключу полна;
#              пусто — исправления ещё не выпущены, «защищено» не ставится
#              никому (решение владельца 2026-10-04).
schema = 1

[[key]]
name = "harness_guard"
required = "strict"
default = "warn"
effective_since = "2.14.0"  # spec-runner 01f84a6 (#64, #90): harness_guard off|warn|strict
# Дыры гарда (RED/verify-first до снимка; правки после GREEN: REVIEW_FIXED,
# post_review, review-pr) закрыты в spec-runner master, CHANGELOG [Unreleased]
# — ни в одной выпущенной версии их нет. Ставить версию релиза, который их
# несёт, — когда он выйдет.
protected_since = ""
reason = """\
Tripwire харнесса (spec-runner #64) проваливает попытку, правящую файлы \
верификации (pyproject.toml, workflows, конфиг), только в strict; warn лишь \
пишет в лог. Класс TASK-022 (#137) — агент чинит оракул вместо задачи — \
ловится только так (ответ spec-runner по devtools#474, 2026-10-04)."""
