# Цели живой приёмки ВНЕ флота (решение владельца 2026-10-09, приёмка E2 §11.8).
#
# `spec-loop` смотрит сюда ТОЛЬКО если репо нет в манифесте флота
# (`ai-orchestrators-workspace/workspace-manifest.toml`), а сам манифест
# прочитан и разобран без ошибок; ошибка манифеста fallback не разрешает.
# Запись — как у манифеста: `git_dir` (одно имя каталога относительно корня
# workspace — каталога, где лежит devtools; абсолютных путей нет) и
# `repo_url`; origin целевого чекаута сверяется с `repo_url` как и для флота.
# Манифест флота ради песочниц не расширяется: его читают инструменты флота.
# Каталог — authority-root (contracts/authority-root/v1/paths.env): правки
# списка мержит только человек.

# Цель обязана быть публичной и проходить стоп-кран DarkFactory без
# исключений (rulesets читаются). Гарантию проверяет opt-in проба
# `DEVTOOLS_TARGETS_PROBE=1` (tests/test_governance_spec_loop.py): API репо
# — visibility public, `halt_gate.check(slug)` — admit. Отдельная песочница:
# состав песочниц conductor не делится (решение владельца 2026-10-09;
# приватный DarkFactory-polygon/polygon на бесплатном плане — rulesets 403).
[targets.spec-loop-sandbox]
git_dir = "spec-loop-sandbox"
repo_url = "https://github.com/andrei-shtanakov/spec-loop-sandbox.git"
