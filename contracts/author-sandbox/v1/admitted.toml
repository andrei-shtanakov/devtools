# Допуск исполняемых файлов харнесса под песочницей авторского агента
# (дизайн `docs/superpowers/specs/2026-09-29-author-agent-sandbox-design.md`
# §14, §19; tasks-спека `spec/author-agent-sandbox-tasks.md`, шаги H1/H2).
#
# Граница запуска (`governance/author_launch`) пускает авторского агента только
# исполняемым файлом, запись о котором здесь есть, и сверяет её БЕЗ запуска
# кандидата: `realpath` из PATH раннера, sha256 содержимого, мажорная версия
# macOS, sha256 шаблона профиля. Версия берётся из записи, а не из
# `--version` кандидата. Нет записи — отказ «не проверен под песочницей».
#
# Запись вносит оператор (шаг H2) по протоколу `make sandbox-admit`
# (`docs/evidence/`), тем же PR. Каталог — authority-root: расширить допуск
# агентским мержем нельзя. Расширение профиля под новую версию харнесса —
# изменение дизайна, не строка этого файла.
#
# Формат записи (массив таблиц `admitted`):
#   harness        = "claude"                 # единственный харнесс v1 (Q1)
#   version        = "2.1.296"                # из протокола допуска
#   realpath       = "/abs/path/to/binary"    # после realpath, без ссылок
#   sha256         = "<64 hex>"               # содержимого файла realpath
#   macos_major    = 26                       # `sw_vers -productVersion`
#   profile_sha256 = "<64 hex>"               # шаблона профиля §12
#   evidence       = "docs/evidence/<файл>.md"
#
# До H2 записей нет: авторский вызов отказывает для любого харнесса.

schema = 1
admitted = []
