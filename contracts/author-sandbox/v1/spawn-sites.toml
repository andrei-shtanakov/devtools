# Перечень исключений правила допустимых форм запуска процессов в
# `governance/` (дизайн `docs/superpowers/specs/2026-09-29-author-agent-sandbox-design.md`
# §19 п.2–3; tasks-спека `spec/author-agent-sandbox-tasks.md`, H1 и TASK-005).
#
# Правило проверяет тест инварианта `tests/test_author_sandbox_invariant.py`
# (TASK-005): место порождения процесса вне защищённой цепочки допустимо, если
# программа — литерал из `allowed_literal_programs`, либо место названо здесь
# поимённо (`module` + `function`, число мест в функции — `count`). Иначе тест
# красный, пока человек не внесёт место сюда: каталог — authority-root.
#
# ГРАНИЦА ГАРАНТИЙ (§19 п.3): это защита от прямого и случайного обхода
# границы запуска авторского агента, НЕ доказательство безопасности кода.
# Уже разрешённые формы (`git` исполняет команды из своей конфигурации,
# адаптер с произвольным argv) позволяют намеренный обход без нового места —
# это остаточный риск ревью PR. Перечень не расширяется ради имитации полной
# гарантии.
#
# Замер 2026-10-11 (AST, все вызовы — `subprocess.run`): 80 мест, из них 70 с
# литеральной программой (`git` 43, `gh` 22, `tmux` 2, `spec-runner` 2,
# `security` 1) и 10 ниже. Места `_run_agent` уходят в
# `governance/author_launch` (ЗЦ) в TASK-005 — тем же PR их записи удаляются.

