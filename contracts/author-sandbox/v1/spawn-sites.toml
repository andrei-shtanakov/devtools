# Перечень исключений правила допустимых форм запуска процессов в
# `governance/` (дизайн `docs/superpowers/specs/2026-09-29-author-agent-sandbox-design.md`
# §19 п.2–3; tasks-спека `spec/author-agent-sandbox-tasks.md`, H1 и TASK-005).
#
# Правило проверяет тест инварианта `tests/test_author_sandbox_invariant.py`
# (TASK-005): место порождения процесса вне защищённой цепочки допустимо, если
# программа — литерал из `allowed_literal_programs`, либо место названо здесь
# поимённо (`module` + `function`, число мест в функции — `count`). Иначе тест
# красный, пока человек не внесёт место сюда: каталог — authority-root.
#
# ГРАНИЦА ГАРАНТИЙ (§19 п.3): это защита от прямого и случайного обхода
# границы запуска авторского агента, НЕ доказательство безопасности кода.
# Уже разрешённые формы позволяют намеренный обход без нового места:
# каждая программа `allowed_literal_programs` умеет исполнить произвольную
# команду (`git` — из своей конфигурации, `alias.x=!…`, `core.sshCommand`;
# `gh` — расширения и алиасы; `tmux new-session … <команда>`; `security`
# имеет доступ к связке ключей), как и адаптер с произвольным argv. Новое
# место с такой программой правило пропускает. Это остаточный риск ревью PR
# (дизайн §17 п.11, §19 п.3); перечень не расширяется ради имитации полной
# гарантии.
#
# Замер 2026-10-11 (AST, все вызовы — `subprocess.run`): 80 мест, из них 70 с
# литеральной программой (`git` 43, `gh` 22, `tmux` 2, `spec-runner` 2,
# `security` 1) и 10 поимённых. TASK-005 (2026-10-12): два места
# `ops._run_agent` переехали в `governance/author_launch` (ЗЦ) вместе с
# литеральным `security` токена связки — их записи удалены; вне ЗЦ поимённых
# мест 8. Запись, места которой в коде больше нет, — тоже красный тест.

schema = 1
allowed_literal_programs = ["git", "gh", "tmux", "spec-runner", "security"]

[[site]]
module = "governance/ops.py"
function = "review"
count = 1
reason = "`sh review-pr.sh` — драйвер ревью-контура (сам authority-root)"

[[site]]
module = "governance/ops.py"
function = "merge"
count = 1
reason = "`merge-pr.sh` — единственный путь агентского мержа (сам authority-root)"

[[site]]
module = "governance/ops.py"
function = "_discovery"
count = 1
reason = "discovery CLI соседа через `uv run --frozen --project` (стадия Need)"

[[site]]
module = "governance/ops.py"
function = "gate_check_s8"
count = 1
reason = "`gate-check` steward из venv devtools либо PATH"

[[site]]
module = "governance/ops.py"
function = "gate_check_candidate"
count = 1
reason = "`gate-check --candidate` steward из venv devtools либо PATH"

[[site]]
module = "governance/edge_check/reviewer.py"
function = "harness_version"
count = 1
reason = "`<binary> --version` ревьюера edge-check (по умолчанию claude)"

[[site]]
