function = "run_reviewer"
count = 1
reason = "ревьюер edge-check без инструментов в пустом каталоге; argv задаёт вызывающий — остаточный риск §19 п.3"

[[site]]
module = "governance/brief_facts.py"
function = "_graphql_repository"
count = 1
reason = "`gh api graphql` с собранными аргументами (сам authority-root)"

# Динамическая загрузка кода вне ЗЦ (правило п.3 инварианта): `importlib`,
# `ctypes`, `multiprocessing`, `__import__`/`getattr` по `subprocess`/`os`.
# Правило НЕ покрывает `exec`/`eval`/`compile`/`runpy` — названо, а не
# закрыто (остаточный риск §19 п.3); известное место такого рода —
# `governance/discovery_approval.py` (`exec(compile(...))` вендор-копии
# `contracts/discovery-approval/v1/`, пин sha256; сам authority-root) —
# записано ниже для видимости.
