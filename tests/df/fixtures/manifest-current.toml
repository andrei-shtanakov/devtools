# ══════════════ TOOLS (тулинг + KB; нужны для восстановления воркспейса) ══════════════
# repo_url подтверждены фактом (git remote get-url origin, 2026-07-15).
# check-release-drift.py читает [tools] с 2026-09-05 (devtools#139): пины здесь
#   валидируются гейтом manifest-drift наравне с [cores]/[apps] — install=git-sha
#   без sha роняет PR. Отсутствующий pyproject у tools — info, а не warn: kapelle
#   на Elixir, spec-runner-vscode на TypeScript, robin-toolkit и ecosystem-kb без
#   pyproject вовсе, версии релиза у них нет.

[tools.devtools]
package_name   = "devtools"
repo_url       = "git@github.com:andrei-shtanakov/devtools.git"
git_dir        = "devtools"
pyproject_path = "devtools/pyproject.toml"    # если нет pyproject — чекер деградирует до info
tag_pattern    = "v*"
tag            = "-"
sha            = "59357804d898"                # bump 2026-08-16: origin/master (был bde8cbe2aa04 от 2026-07-15)
install        = "git-sha"
publish        = "none"
rust           = false

