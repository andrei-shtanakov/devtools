# Fixture project of the df stage-1 root acceptance (Task 13-B). The root
# world commits these files together with a copy of `df/` (the admin code
# `install_admin` takes from the pin named `devtools`) into a bare repo; the
# release builds this project as `df-build`. No `[tool.uv]`: UV_NO_CONFIG
# would drop it (spec 3.2).
[project]
name = "dfprobe"
version = "0.1.0"
description = "df stage-1 acceptance fixture"
requires-python = ">=3.12"
dependencies = ["six>=1.16 ; sys_platform != 'win32'"]

[project.scripts]
dfprobe = "dfprobe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["dfprobe.py"]
