# df installer, stage-1 acceptance (Task 13 of
# docs/superpowers/plans/2026-10-16-df-installer-stage1.md, pre-flight rulings
# R73-R95). Root commands exist only here: hosted runners are disposable and
# have passwordless sudo; the root run never happens on a workstation.
# Order of a cell: arch check (fails) -> Step 0 facts (recorded, never fail
# the job) -> mechanism probes (fail, named by the step) -> ordinary tests/df
# -> root run (R76) -> live install of core in `/` -> scope guard (last:
# only `full` with no -k is green).
# Actions pinned by full commit SHA, as ci.yml.
# No workflow_dispatch: the file runs from the PR before it is on master.
name: df-stage1

on:
  pull_request:
    paths:
      - "df/**"
      - "tests/df/**"
      - ".github/workflows/df-stage1.yml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: df-stage1-${{ github.ref }}
  cancel-in-progress: true

env:
  # Iteration selector (pre-flight section 6): probes | root-only | full.
  # Only `full` with an empty DF_STAGE1_K can be green: the scope guard (last
  # step) fails every other setting, so an iteration commit runs its narrowed
  # steps and its cell is red by design (PR #632 review).
  DF_STAGE1_SCOPE: full
  # Optional `-k` expression of the root run while iterating; empty = all.
  DF_STAGE1_K: ""
  # The job stage2a (<os>) (stage 2a Task 14, R14-6): full | off; only full
  # with an empty DF_STAGE2A_K can be green (its own scope guard).
  DF_STAGE2A_SCOPE: full
  # Optional `-k` expression narrowing the stage-2a root run; empty = all.
  DF_STAGE2A_K: ""
  # R78: a skip for a missing or unpinned uv fails the run.
  DF_REQUIRE_PINNED_UV: "1"

jobs:
  stage1:
    name: stage1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: arch check
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # UV_PINNED_VERSION (df/lockset.py); else the admin-Python tests skip.
          version: "0.11.23"
      # R96: /usr/bin/git, otool and make are xcrun shims; on the image they
      # resolve into /Applications/Xcode_*.app (uid 501, /Applications
      # group-writable), which df correctly refuses (CI run 1). Configure the
      # runner as a supported host: select the Command Line Tools here; the
      # trust verdict is df's own policy, after `uv sync` (next R96 step).
      - name: select CommandLineTools (R96)
        if: runner.os == 'macOS'
        run: |
          clt=/Library/Developer/CommandLineTools
          mkdir -p "$RUNNER_TEMP/df-stage1/step0"
          record="$RUNNER_TEMP/df-stage1/step0/xcode-select.txt"
          echo "before: $(xcode-select -p)" > "$record"
          fail() { echo "::error title=select CommandLineTools (R96)::$1"; exit 1; }
          test -d "$clt" || fail "$clt absent"
          sudo -n xcode-select -s "$clt" || fail "xcode-select -s failed"
          test "$(xcode-select -p)" = "$clt" || fail "selection did not stick"
          echo "after: $(xcode-select -p)" >> "$record"
          cat "$record"
      - run: uv python install 3.12
      - run: uv sync --frozen
      # R96 verdict: approved_cli_problems for git/tar/chmod (df runs otool
      # through the same shim) as the runner; any problem fails by name.
      - name: verify CommandLineTools with df policy (R96)
        if: runner.os == 'macOS'
        run: >
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -I -c "import sys;
          sys.path.append('.'); from tests.df.ci_step0 import r96_main;
          sys.exit(r96_main())"

      # ---- Step 0: facts of this runner (tests/df/ci_step0.py) -------------
      # A crash of the probe script is a bug to read in the log, not a reason
      # to lose the rest of the cell.
      - name: step 0 facts (runner user)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ ! -x .venv/bin/python ]; then
            echo "::notice title=step 0::skipped: no .venv (uv sync did not run)"
            exit 0
          fi
          .venv/bin/python -m tests.df.ci_step0 runner \
            --out "$RUNNER_TEMP/df-stage1/step0"
      - name: step 0 install auditd (absence is a fact)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        continue-on-error: true
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y -qq --no-install-recommends auditd
      - name: step 0 facts (root)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ ! -x .venv/bin/python ]; then
            echo "::notice title=step 0::skipped: no .venv (uv sync did not run)"
            exit 0
          fi
          sudo -n install -d -m 0700 "$RUNNER_TEMP/root-home"
          sudo -n env "PATH=$PATH" "HOME=$RUNNER_TEMP/root-home" \
            PYTHONDONTWRITEBYTECODE=1 DF_ROOT_ACCEPTANCE=1 \
            .venv/bin/python -m tests.df.ci_step0 root \
            --out "$RUNNER_TEMP/df-stage1/step0" --uv "$(command -v uv)"

      # ---- mechanism probes: the run_as/spawn_as path, failing by name -----
      - name: "mechanism: unshare --net + setpriv to nobody"
        if: runner.os == 'Linux'
        run: |
          want=$(id -u nobody)
          got=$(sudo -n /usr/bin/unshare --net -- /usr/bin/setpriv \
            --reuid=nobody --regid=nogroup --init-groups -- /usr/bin/id -u)
          test "$got" = "$want" || {
            echo "::error title=mechanism unshare/setpriv::uid '$got', want $want"
            exit 1
          }
      - name: "mechanism: unshare --net as root"
        if: runner.os == 'Linux'
        run: sudo -n /usr/bin/unshare --net -- /usr/bin/true
      - name: "mechanism: readelf -d /bin/sh"
        if: runner.os == 'Linux'
        run: /usr/bin/readelf -d /bin/sh
      - name: "mechanism: GNU tar"
        if: runner.os == 'Linux'
        run: |
          /usr/bin/tar --version | tee "$RUNNER_TEMP/tar-version.txt"
          grep -q '(GNU tar)' "$RUNNER_TEMP/tar-version.txt" || {
            echo "::error title=mechanism GNU tar::/usr/bin/tar is not GNU tar"
            exit 1
          }
      - name: "mechanism: sudo -u nobody sandbox-exec"
        if: runner.os == 'macOS'
        run: |
          want=$(id -u nobody)
          got=$(sudo -n -u nobody /usr/bin/sandbox-exec \
            -p '(version 1)(allow default)(deny network*)' /usr/bin/id -u)
          test "$got" = "$want" || {
            echo "::error title=mechanism sudo/sandbox-exec::uid '$got', want $want"
            exit 1
          }
      - name: "mechanism: otool -L /bin/sh"
        if: runner.os == 'macOS'
        run: /usr/bin/otool -L /bin/sh

      # ---- tests ------------------------------------------------------------
      # R77: the `network` marker is included here (both cells), not locally.
      - name: tests/df (ordinary)
        if: env.DF_STAGE1_SCOPE == 'full'
        run: >
          uv run --frozen pytest -q -m 'not slow and not harness'
          --junitxml "$RUNNER_TEMP/df-stage1/junit-ordinary.xml" tests/df
      # R76: root never rewrites the runner's .venv or uv cache: own HOME and
      # UV_CACHE_DIR, `--no-sync`, no pytest cache, no bytecode; last step.
      # The canary test_root_gate_open is always selected (also with
      # DF_STAGE1_K), and the runner checks the junit afterwards (I1): the
      # step fails unless the canary passed, nothing was skipped by the root
      # gate and every collected root test is in the junit, so neither a
      # gate that never opened nor a narrowed selection leaves it green.
      # Runs after a red ordinary step too (the cell stays red).
      - name: tests/df root run
        if: ${{ !cancelled() && env.DF_STAGE1_SCOPE != 'probes' }}
        run: |
          # The cell is already red if uv sync did not run: no second error.
          # A venv without pytest is a broken sync, never a green skip (m1).
          if [ ! -x .venv/bin/python ]; then
            echo "::notice title=root run::skipped: no .venv (uv sync did not run)"
            exit 0
          fi
          if [ ! -x .venv/bin/pytest ]; then
            echo "::error title=root run::.venv exists but .venv/bin/pytest does not"
            exit 1
          fi
          sudo -n install -d -m 0700 "$RUNNER_TEMP/root-home"
          # No -k in full scope: every root test (the canary included) runs;
          # an iteration's -k keeps the canary (CI run 40192503738 ran the
          # canary alone with an empty DF_STAGE1_K).
          select=()
          if [ -n "$DF_STAGE1_K" ]; then
            select=(-k "($DF_STAGE1_K) or test_root_gate_open")
          fi
          as_root=(sudo -n env "PATH=$PATH" "HOME=$RUNNER_TEMP/root-home"
            "UV_CACHE_DIR=$RUNNER_TEMP/uv-root" DF_ROOT_ACCEPTANCE=1
            "DF_STAGE1_OUT=$RUNNER_TEMP/df-stage1"
            DF_REQUIRE_PINNED_UV=1 PYTHONDONTWRITEBYTECODE=1
            uv run --frozen --no-sync pytest -p no:cacheprovider
            -m "root and not stage2a")
          # Collected in the same environment and selection: the guard below
          # fails if any of them is missing from the junit (13-B review). The
          # stage-2a tests are the job stage2a's (R14-6).
          collected="$RUNNER_TEMP/df-stage1/root-collected.txt"
          "${as_root[@]}" --collect-only -q "${select[@]}" tests/df > "$collected"
          set +e
          "${as_root[@]}" -q -rs "${select[@]}" \
            --junitxml "$RUNNER_TEMP/df-stage1/junit-root.xml" tests/df
          rc=$?
          set -e
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m tests.df.ci_junit \
            "$RUNNER_TEMP/df-stage1/junit-root.xml" --expect "$collected"
          exit "$rc"

      # Host adaptation, not a df change (owner decision 26.10): the hosted
      # Ubuntu image ships `/opt` group/other-writable with an ACL, which df
      # refuses by spec 3.10 (run 40316417187: `trusted-paths: /opt`). Make
      # the runner a supported host as README «Подготовка» requires, like the
      # R96 CLT selection; on macOS only the facts are logged (nothing is
      # changed unless a run shows df refuses `/opt` there).
      - name: configure /opt as a supported host (owner 26.10)
        if: ${{ !cancelled() && env.DF_STAGE1_SCOPE == 'full' }}
        run: |
          if [ ! -x .venv/bin/python ]; then
            echo "::notice title=configure /opt::skipped: no .venv (uv sync did not run)"
            exit 0
          fi
          # live/ may be root's (the root run's evidence): back to the runner.
          sudo -n chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/df-stage1"
          mkdir -p "$RUNNER_TEMP/df-stage1/live"
          record="$RUNNER_TEMP/df-stage1/live/opt-host.txt"
          facts() {
            ls -ld /opt
            if [ "$RUNNER_OS" = Linux ]; then getfacl -p /opt; else ls -led /opt; fi
          }
          { echo "before:"; facts; } > "$record" 2>&1
          if [ "$RUNNER_OS" = Linux ]; then
            sudo -n chmod go-w /opt
            sudo -n setfacl -b /opt
          fi
          { echo "after:"; facts; } >> "$record" 2>&1
          cat "$record"
      # Live install of profile `core` in the production layout `/`, as
      # README «Установка DarkFactory: этап 1» says, every step a process
      # (tests/df/live_install.py, as the runner user; root only through
      # `sudo`). After the root run: its worlds need `df-build` absent, and
      # this install leaves `df-build` and `/opt/df` for good (stage 1 has no
      # uninstall); state the root run left is a finding of the script.
      # Runs after a red root run too (the cell stays red).
      - name: live install of core (production layout)
        if: ${{ !cancelled() && env.DF_STAGE1_SCOPE == 'full' }}
        run: |
          if [ ! -x .venv/bin/python ]; then
            echo "::notice title=live install::skipped: no .venv (uv sync did not run)"
            exit 0
          fi
          # live/ may be root's (the root run's evidence): back to the runner.
          sudo -n chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/df-stage1"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m tests.df.live_install \
            --out "$RUNNER_TEMP/df-stage1" --work "$RUNNER_TEMP/df-live"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: df-stage1-${{ matrix.os }}
          path: ${{ runner.temp }}/df-stage1
          if-no-files-found: warn
      # N1: root-owned leftovers (root-home, uv-root, step0, junit-root) back
      # to the runner, so the runner's own temp cleanup does not trip on them.
      - name: return RUNNER_TEMP to the runner
        if: always()
        run: sudo -n chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP"
      # Pre-flight section 6: only `full` with no -k is green. A narrowed scope
      # (probes, root-only: whole test steps skipped, and a skipped step is not
      # red) or a run selecting a subset of the root tests is refused here.
      # Last, so an iteration still runs its narrowed steps first.
      - name: scope guard
        if: always()
        run: |
          if [ "$DF_STAGE1_SCOPE" != full ]; then
            echo "::error title=scope guard::DF_STAGE1_SCOPE is '$DF_STAGE1_SCOPE'; only full can be green"
            exit 1
          fi
          if [ -n "$DF_STAGE1_K" ]; then
            echo "::error title=scope guard::DF_STAGE1_K must be empty in full scope"
            exit 1
          fi

  # Stage 2a, Task 14 (R14-6): root acceptance of spec 4.5 without merge, in
  # a fresh runner of the same matrix, after stage1 (its result does not gate
  # this job: an iteration narrows stage1 and stays red there). The tests
  # carry the markers `root` and `stage2a`; the selection keeps the canary
  # test_root_gate_open, and the junit guard checks collected vs run, as in
  # stage1's root run. Evidence: artifact df-stage2a-<os>.
  stage2a:
    name: stage2a (${{ matrix.os }})
    needs: stage1
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - name: arch check
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
      # R96, as in stage1: the installed world builds with the CLT shims.
      - name: select CommandLineTools (R96)
        if: runner.os == 'macOS'
        run: |
          clt=/Library/Developer/CommandLineTools
          fail() { echo "::error title=select CommandLineTools (R96)::$1"; exit 1; }
          test -d "$clt" || fail "$clt absent"
          sudo -n xcode-select -s "$clt" || fail "xcode-select -s failed"
          test "$(xcode-select -p)" = "$clt" || fail "selection did not stick"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: verify CommandLineTools with df policy (R96)
        if: runner.os == 'macOS'
        run: >
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -I -c "import sys;
          sys.path.append('.'); from tests.df.ci_step0 import r96_main;
          sys.exit(r96_main())"
      # The stage-1 observer of the carried test_launch_cwd_outside_builder_tree
      # needs auditd on Linux; its absence makes that test an xfail, a fact.
      - name: install auditd (observer)
        if: ${{ runner.os == 'Linux' && env.DF_STAGE2A_SCOPE == 'full' }}
        continue-on-error: true
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y -qq --no-install-recommends auditd
      # The stage-2a world is the production layout `/` (R14-8): the same
      # host adaptation as stage1's live install (owner decision 26.10), and
      # for `/home` too, where the roles' homes are (the image's `/home`
      # carries an ACL, which df refuses by spec 3.10: CI run 40852118817).
      - name: configure /opt and /home as a supported host (owner 26.10)
        if: ${{ env.DF_STAGE2A_SCOPE == 'full' }}
        run: |
          mkdir -p "$RUNNER_TEMP/df-stage2a"
          record="$RUNNER_TEMP/df-stage2a/opt-host.txt"
          facts() {
            ls -ld /opt /home
            if [ "$RUNNER_OS" = Linux ]; then getfacl -p /opt /home; else ls -led /opt; fi
          }
          { echo "before:"; facts; } > "$record" 2>&1
          if [ "$RUNNER_OS" = Linux ]; then
            sudo -n chmod go-w /opt /home
            sudo -n setfacl -b /opt /home
          fi
          { echo "after:"; facts; } >> "$record" 2>&1
          cat "$record"
      - name: tests/df stage-2a root run
        if: ${{ env.DF_STAGE2A_SCOPE == 'full' }}
        run: |
          out="$RUNNER_TEMP/df-stage2a"
          mkdir -p "$out"
          sudo -n install -d -m 0700 "$RUNNER_TEMP/root-home"
          select=(-k "stage2a or test_root_gate_open")
          if [ -n "$DF_STAGE2A_K" ]; then
            select=(-k "(stage2a and ($DF_STAGE2A_K)) or test_root_gate_open")
          fi
          as_root=(sudo -n env "PATH=$PATH" "HOME=$RUNNER_TEMP/root-home"
            "UV_CACHE_DIR=$RUNNER_TEMP/uv-root" DF_ROOT_ACCEPTANCE=1
            "DF_STAGE1_OUT=$out"
            DF_REQUIRE_PINNED_UV=1 PYTHONDONTWRITEBYTECODE=1
            uv run --frozen --no-sync pytest -p no:cacheprovider -m root)
          collected="$out/root-collected.txt"
          "${as_root[@]}" --collect-only -q "${select[@]}" tests/df > "$collected"
          set +e
          "${as_root[@]}" -q -rs "${select[@]}" \
            --junitxml "$out/junit-root.xml" tests/df
          rc=$?
          set -e
          sudo -n chown -R "$(id -u):$(id -g)" "$out"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m tests.df.ci_junit \
            "$out/junit-root.xml" --expect "$collected"
          exit "$rc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: df-stage2a-${{ matrix.os }}
          path: ${{ runner.temp }}/df-stage2a
          if-no-files-found: warn
      - name: return RUNNER_TEMP to the runner
        if: always()
        run: sudo -n chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP"
      - name: scope guard
        if: always()
        run: |
          if [ "$DF_STAGE2A_SCOPE" != full ]; then
            echo "::error title=scope guard::DF_STAGE2A_SCOPE is '$DF_STAGE2A_SCOPE'; only full can be green"
            exit 1
          fi
          if [ -n "$DF_STAGE2A_K" ]; then
            echo "::error title=scope guard::DF_STAGE2A_K must be empty in full scope"
            exit 1
          fi
