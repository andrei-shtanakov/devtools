name: discovery-contract-integrity

on: [pull_request]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run --frozen tools/check_discovery_vendor.py consistency
      - run: uv run --frozen tools/check_discovery_vendor.py provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
