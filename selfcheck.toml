# selfcheck — allowlist и роли devtools (спека §1.4, §2.4).
# Каждая запись [[allow]] обязана иметь reason и until; истёкшая — находка.

[[allow]]
anchor = "file:issue_console.py"
repo = "devtools"
reason = "неприкасаем по решению владельца: новый TUI — новый файл"
until = 2027-03-31

# Артефакты сборки и вендор-бандлы — вне корпуса (спека §11.2): иначе как самые
# крупные клоны jscpd они займут потолок судьи первыми (замер S5 2026-09-27).
[corpus]
exclude = [".obsidian/plugins/**"]

# Ручные точки входа (спека §3.2.5): инструменты, которые запускает человек.

[[operator]]
repo = "devtools"
path = "attest-vendor.sh"
reason = "гейт волн ре-вендора; запускает оператор (authority-root, #263)"

[[operator]]
repo = "devtools"
path = "discover_models.py"
reason = "discovery моделей по ADR-ECO-003a; запускает оператор, README"
