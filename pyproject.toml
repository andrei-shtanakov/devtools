# Minimal uv project that exists ONLY to pin the shared `plan-fields` package
# for `check-plan-fields.py` (ADR-ECO-005 PF-7). The other devtools scripts are
# stdlib / Python 3.11 and do NOT use this env — only `make plan-check` does,
# through `uv run --frozen`.
[project]
name = "devtools-plan-check"
version = "0.0.0"
description = "Pinned env for check-plan-fields.py — the shared plan-fields parser"
requires-python = ">=3.12"
dependencies = [
    "plan-fields",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.uv.sources]
# Pinned to an IMMUTABLE dispatcher commit, fetched by git — never a
# workspace-relative path, so the pin is reproducible and does not follow a
# sibling checkout. Bump deliberately in its own PR.
plan-fields = { git = "https://github.com/andrei-shtanakov/dispatcher", rev = "f7f2cbcbbffc8d83870848317228c0a3487780ec", subdirectory = "packages/plan-fields" }
steward = { git = "https://github.com/andrei-shtanakov/steward", rev = "2c71ed770015f6baa00dedc708e8c0bbc5a8e41b" }

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=8",
]
# Только для governance-контура (спека §3/§4): steward — content-check API S4,
# textual — behaviour console (Task 4, интерактивная TUI-ветка). Оба импортируются
# лениво внутри console.py (textual — в _build_app; console_model, который тянет
# steward транзитивно через bundle_state.py, — в _bundle_summary_for/main): сам
# `import governance.console` и --json/non-TTY plain-путь работают без группы;
# пути, которым реально нужен list_runs()/bundle_summary(), без steward
# недоступны и скипаются тестами (см. task-4-report.md).
# Пин steward — единственно в [tool.uv.sources] (паттерн plan-fields ниже): bump'ить
# rev тут значило бы держать его в двух местах, а bump — аудируемый механизм
# включения автономной ветки (§6, §12 п.7), правка одного из двух мест либо
# уронит резолв, либо тихо выберет одну сторону (финальное ревью M-1).
governance = ["steward", "textual>=1"]
selfcheck = [
    "actionlint-py==1.7.12.25",
    "deptry==0.25.1",
    "pyrefly==1.3.1",
    "radon==6.0.1",
    "ruff==0.16.9",
    "shellcheck-py==0.11.0.1",
    "vulture==2.16",
    "zizmor==1.30.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Вендоренные фикстуры criteria-closure/v1: байты — это кейсы (синтаксическая
# ошибка, NUL, CRLF); ни линтовать, ни форматировать.
# Вендоренные копии (побайтово под manifest) не правятся линтером: discovery-
# contract (discovery-toolkit) — правка ломает test_discovery_vendor.
extend-exclude = [
    "contracts/criteria-closure/v1/fixtures",
    "governance/discovery_contract",
]

[tool.ruff.format]
# Формат — только для кода. ruff 0.16 форматирует и код в markdown, а .md здесь —
# записи (планы, спеки, evidence прогонов): их байты не переписываются (#461).
# issue_console.py — рабочий TUI владельца, не правится (указание 2026-08-30):
# форматтер его не трогает (байты до #504), линтер — см. per-file-ignores.
exclude = ["**/*.md", "issue_console.py"]

[tool.ruff.lint]
# Базовый набор, который держит CI (devtools#461, ступень 1): правила ruff 0.16
# по умолчанию шире (замер 28.09 — 329 нарушений). Расширять волнами, каждая —
# вместе с чисткой, чтобы CI не краснел на старом долге.
select = [
    "E4", "E7", "E9", "F",
    # ступень 3, волна 1 — механические, с чисткой (#461)
    "I", "UP", "FURB167",
    # волна 2 — явный check у subprocess.run: все 83 вызова (+6 в
    # issue_console.py) разбирают код возврата сами (замер AST), поэтому
    # check=False; новый вызов обязан решить явно (#461)
    "PLW1510",
]

[tool.ruff.lint.per-file-ignores]
# Базовый набор (E4/E7/E9/F) issue_console.py охраняет, как прежде; правила
# волн, требующие переписать его байты, — нет. Новая волна добавляет сюда
# свои коды, если файл их нарушает (#461, ревью #506).
"issue_console.py" = ["I", "UP", "FURB167", "PLW1510"]
