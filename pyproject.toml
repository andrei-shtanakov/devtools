# Minimal uv project that exists ONLY to pin the shared `plan-fields` package
# for `check-plan-fields.py` (ADR-ECO-005 PF-7). The other devtools scripts are
# stdlib / Python 3.11 and do NOT use this env — only `make plan-check` does,
# through `uv run --frozen`.
[project]
name = "devtools-plan-check"
version = "0.0.0"
description = "Pinned env for check-plan-fields.py — the shared plan-fields parser"
requires-python = ">=3.12"
dependencies = ["plan-fields"]

[tool.uv]
package = false

[tool.uv.sources]
# Pinned to an IMMUTABLE dispatcher commit, fetched by git — never a
# workspace-relative path, so the pin is reproducible and does not follow a
# sibling checkout. Bump deliberately in its own PR.
plan-fields = { git = "https://github.com/andrei-shtanakov/dispatcher", rev = "65f03ea9e5964e4488bcd254e491fc42abb1bd96", subdirectory = "packages/plan-fields" }
steward = { git = "https://github.com/andrei-shtanakov/steward", rev = "4a1c7c44a85accf609b40cb14115eccefb26f6c2" }

[dependency-groups]
dev = ["pytest>=8"]
# Только для governance-контура (спека §3/§4): steward — content-check API S4,
# textual понадобится console.py этапа B. Обычные devtools-команды группу не тянут.
governance = [
    "steward @ git+https://github.com/andrei-shtanakov/steward@4a1c7c44a85accf609b40cb14115eccefb26f6c2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
