# df-trust: проверка перехода журнала эпох (`epochs.yaml`), спека A rev 16 §6.3.
# Шаблон devtools; копируется в репо df-trust командой установки (df setup-trust).
#
# ПЛЕЙСХОЛДЕРЫ (заменить до коммита; пока не заменены, job падает на checkout):
#   DEVTOOLS_REPO  — репо devtools, откуда берётся CLI (обычно
#                    "andrei-shtanakov/devtools").
#   DEVTOOLS_REF   — ПОЛНЫЙ 40-символьный SHA релиза devtools с Task 10a
#                    (merge-коммит; пин, не ветка и не тег).
#
#   UV_VERSION     — точная версия uv (задаётся здесь, не из дерева PR).
#
# ОБЯЗАТЕЛЬНАЯ ЗАЩИТА (без неё проверка лишь советует): на `pull_request` файл
# workflow берётся из самого PR. Поэтому в ruleset дефолтной ветки df-trust:
#   1. контекст `check-transition` (имя job; `epochs / check-transition` — лишь
#      подпись в UI) — REQUIRED status check, включено
#      "Require branches to be up to date before merging";
#   2. CODEOWNERS: `/.github/ @<human>`, `/source.env @<human>`,
#      `/epochs.yaml @<human>` + "Require review from Code Owners" —
#      файлы корня доверия и workflow ревьюит человек.
#
# Инварианты: CLI исполняется из checkout devtools по пиненому SHA, НИКОГДА из
# дерева PR; триггер pull_request (не pull_request_target); токен только на
# чтение; сторонние actions пинены полными commit SHA.
name: epochs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEVTOOLS_REPO: "<devtools-repo — set by df setup-trust>"
  DEVTOOLS_REF: "<pinned-sha — set by df setup-trust>"
  UV_VERSION: "0.11.23"

jobs:
  check-transition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout df-trust (pull_request: test-merge commit refs/pull/N/merge; push: pushed commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: df-trust
          persist-credentials: false
      - name: Checkout pinned devtools (CLI source, not from the PR tree)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEVTOOLS_REPO }}
          ref: ${{ env.DEVTOOLS_REF }}
          path: devtools-pinned
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          working-directory: devtools-pinned
      - name: Fetch immutable base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          cd df-trust
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Check journal transition
        run: |
          set -euo pipefail
          cd devtools-pinned
          uv run --frozen --exact --no-config --no-env-file \
            python -I governance/act_epochs.py \
            --check-transition "$BASE_SHA" \
            --repo "$GITHUB_WORKSPACE/df-trust" \
            --file epochs.yaml --source-env source.env
