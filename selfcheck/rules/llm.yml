# llm-sites (spec §3.4): candidate LLM call sites; Python argv is completed by
# the AST evaluator in selfcheck.graph.resolver (e.g. `cmd = [...]; run(cmd)`).
rules:
  - id: py-launch
    languages: [python]
    severity: INFO
    message: process launch (checked for a harness binary by selfcheck)
    pattern-either:
      - pattern: subprocess.$F($X, ...)
      - pattern: asyncio.create_subprocess_exec($X, ...)
  - id: cli-shell
    languages: [bash]
    severity: INFO
    message: harness CLI launch (mechanism A)
    pattern-regex: (?m)^\s*(?:[A-Za-z_]\w*=\S*\s+)*(?:exec\s+|command\s+)?(?:claude|codex|opencode|aider|qwen|ollama|llama-cli|copilot)\s
  - id: sdk-python
    languages: [python]
    severity: INFO
    message: LLM SDK call (mechanism B)
    pattern-either:
      - pattern: $C.messages.create(...)
      - pattern: $C.chat.completions.create(...)
      - pattern: $C.responses.create(...)
  - id: http-python
    languages: [python]
    severity: INFO
    message: LLM HTTP call (mechanism C)
    patterns:
      - pattern-either:
          - pattern: requests.$M($URL, ...)
          - pattern: httpx.$M($URL, ...)
          - pattern: urllib.request.urlopen($URL, ...)
          - pattern: urlopen($URL, ...)
      - metavariable-regex:
          metavariable: $URL
          regex: (?s).*(/v1/messages|/v1/chat/completions|/api/generate|/completion\b).*
  - id: argv-literal
    languages: [python]
    paths:
      include: ["*.py"]
    severity: INFO
    message: harness argv construction (mechanism A)
    patterns:
      - pattern-either:
          - pattern: "[$FIRST, $SECOND, ...]"
          - pattern: "($FIRST, $SECOND, ...)"
      - metavariable-regex:
          metavariable: $SECOND
          regex: ^["'](?:-{1,2}[A-Za-z][\w-]*|exec|run)["']$
      - metavariable-regex:
          metavariable: $FIRST
          regex: (?i)^(?:["'](?:claude|codex|opencode|aider|pi|qwen|ollama|llama-cli|copilot)["']|.*(?:claude|codex|opencode|aider|ollama|qwen|copilot)_?(?:command|cmd|bin|binary|cli|path|exe)\b.*)$
  - id: argv-literal-ts
    languages: [js, ts]
    # no TS parse of extensionless shell scripts (--scan-unknown-extensions)
    paths:
      include: ["*.ts", "*.tsx", "*.js", "*.mjs", "*.cjs"]
    severity: INFO
    message: harness argv construction (mechanism A)
    patterns:
      - pattern: "[$FIRST, $SECOND, ...]"
      - metavariable-regex:
          metavariable: $SECOND
          regex: ^["'`](?:-{1,2}[A-Za-z][\w-]*|exec|run)["'`]$
      - metavariable-regex:
          metavariable: $FIRST
          regex: ^["'`](?:claude|codex|opencode|aider|pi|qwen|ollama|llama-cli|copilot)["'`]$
  - id: harness-resolve
    languages: [python]
    paths:
      include: ["*.py"]
    severity: INFO
    message: harness binary resolution (mechanism A)
    patterns:
      - pattern-either:
          - pattern: os.environ.get($K, $BIN)
          - pattern: os.getenv($K, $BIN)
          - pattern: shutil.which($BIN)
      - metavariable-regex:
          metavariable: $BIN
          regex: ^["'](?:claude|codex|opencode|aider|pi|qwen|ollama|llama-cli|copilot)["']$
  - id: spawn-ts
    languages: [js, ts]
    paths:
      include: ["*.ts", "*.tsx", "*.js", "*.mjs", "*.cjs"]
    severity: INFO
    message: harness process launch (mechanism A)
    patterns:
      - pattern-either:
          - pattern: spawn($BIN, ...)
          - pattern: spawnSync($BIN, ...)
          - pattern: execFile($BIN, ...)
          - pattern: execa($BIN, ...)
      - metavariable-regex:
          metavariable: $BIN
          regex: ^["'`](?:claude|codex|opencode|aider|pi|qwen|ollama|llama-cli|copilot)["'`]$
  - id: sdk-ts
    languages: [js, ts]
    paths:
      include: ["*.ts", "*.tsx", "*.js", "*.mjs", "*.cjs"]
    severity: INFO
    message: LLM SDK (mechanism B)
    pattern-either:
      - pattern: new Anthropic(...)
      - pattern: new OpenAI(...)
      - pattern: $C.messages.create(...)
      - pattern: $C.chat.completions.create(...)
      - pattern: import $X from "@anthropic-ai/sdk"
      - pattern: import $X from "openai"
      - pattern: import { $X } from "@openai/agents"
      - pattern: import * as $X from "@anthropic-ai/sdk"
      - pattern: import * as $X from "openai"
  - id: endpoint
    # regex, not a language list: with js/ts listed semgrep parses
    # extensionless shell scripts as JS (PartialParsing → partial, #424)
    languages: [regex]
    severity: INFO
    message: LLM endpoint URL (mechanism C)
    pattern-regex: (?:/v1/messages|/chat/completions|/api/chat|/api/generate|/completion)\b
